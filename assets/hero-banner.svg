<svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#091520"/>
    </linearGradient>

    <radialGradient id="glowEmerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 220) rotate(-20) scale(300 180)">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(770 70) rotate(35) scale(280 180)">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="48" y1="95" x2="540" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="accentBar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="cardStroke" x1="0" y1="0" x2="900" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.45"/>
    </linearGradient>

    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.8" opacity="0.55"/>
    </pattern>

    <clipPath id="roundedCard">
      <rect x="1" y="1" width="898" height="248" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 4; }
      50% { opacity: 0.45; r: 5.2; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .cursor { animation: blink 1.1s infinite; }
    .dot-pulse { animation: pulseDot 2.2s ease-in-out infinite; }
    .float-group { animation: floatSlow 5s ease-in-out infinite; }
  </style>

  <g clip-path="url(#roundedCard)">
    <!-- Background -->
    <rect width="900" height="250" fill="url(#bgGrad)"/>
    <rect width="900" height="250" fill="url(#gridPattern)"/>
    <rect width="900" height="250" fill="url(#glowEmerald)"/>
    <rect width="900" height="250" fill="url(#glowCyan)"/>

    <!-- Top Terminal Bar -->
    <rect x="0" y="0" width="900" height="38" fill="#0B1120" fill-opacity="0.88"/>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#1E293B" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="24" cy="19" r="5.5" fill="#EF4444" fill-opacity="0.9"/>
    <circle cx="42" cy="19" r="5.5" fill="#F59E0B" fill-opacity="0.9"/>
    <circle cx="60" cy="19" r="5.5" fill="#10B981" fill-opacity="0.9"/>

    <!-- Terminal Path -->
    <text x="82" y="23" class="mono" font-size="12" fill="#94A3B8">fathur@unila</text>
    <text x="169" y="23" class="mono" font-size="12" fill="#475569">:</text>
    <text x="178" y="23" class="mono" font-size="12" fill="#38BDF8">~/fhariyadi-dev</text>
    <text x="292" y="23" class="mono" font-size="12" fill="#10B981">(main)</text>

    <!-- Live Status Pill -->
    <rect x="676" y="9" width="204" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="691" cy="19" r="4" fill="#10B981" class="dot-pulse"/>
    <text x="703" y="23" class="mono" font-size="10.5" font-weight="600" fill="#6EE7B7" letter-spacing="0.5">OPEN TO COLLAB · ID</text>

    <!-- Left Content -->
    <text x="48" y="76" class="mono" font-size="13" fill="#10B981">$ whoami --profile</text>
    <rect x="194" y="64" width="8" height="15" rx="1.5" fill="#10B981" class="cursor"/>

    <text x="48" y="128" class="sans" font-size="42" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.8">Fathur Hariyadi</text>

    <!-- Handle Pill -->
    <rect x="48" y="144" width="102" height="24" rx="6" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <text x="99" y="160" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#34D399">@fthrxyzz</text>

    <rect x="160" y="144" width="138" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
    <text x="229" y="160" text-anchor="middle" class="mono" font-size="11.5" fill="#7DD3FC">fhariyadi-dev</text>

    <rect x="308" y="144" width="118" height="24" rx="6" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1"/>
    <text x="367" y="160" text-anchor="middle" class="mono" font-size="11.5" fill="#A5B4FC">@askyuna.ai</text>

    <!-- Taglines -->
    <text x="48" y="196" class="sans" font-size="15" font-weight="600" fill="#E2E8F0">Computer Science Undergraduate · Universitas Lampung</text>
    <text x="48" y="219" class="mono" font-size="12.5" fill="#94A3B8">Web Engineering  //  TypeScript &amp; React  //  AI Agent Workflows</text>

    <!-- Right Bento Spec Card -->
    <g class="float-group">
      <rect x="590" y="62" width="272" height="158" rx="12" fill="#0F172A" fill-opacity="0.82" stroke="#1E293B" stroke-width="1.2"/>
      <rect x="590" y="62" width="272" height="28" rx="12" fill="#111C33"/>
      <rect x="590" y="78" width="272" height="12" fill="#111C33"/>
      <line x1="590" y1="90" x2="862" y2="90" stroke="#1E293B" stroke-width="1"/>

      <text x="606" y="80" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="0.8">SYSTEM.SPEC // V2.6</text>
      <circle cx="844" cy="76" r="3.5" fill="#10B981"/>

      <text x="606" y="113" class="mono" font-size="11.5" fill="#64748B">BASE</text>
      <text x="682" y="113" class="mono" font-size="11.5" fill="#F1F5F9">Lampung, Indonesia</text>

      <text x="606" y="135" class="mono" font-size="11.5" fill="#64748B">UNIV</text>
      <text x="682" y="135" class="mono" font-size="11.5" fill="#A7F3D0">CS · UNILA (ex-UAD)</text>

      <text x="606" y="157" class="mono" font-size="11.5" fill="#64748B">STACK</text>
      <text x="682" y="157" class="mono" font-size="11.5" fill="#7DD3FC">TS · React · Vite · C++</text>

      <text x="606" y="179" class="mono" font-size="11.5" fill="#64748B">FOCUS</text>
      <text x="682" y="179" class="mono" font-size="11.5" fill="#C4B5FD">Web Dev &amp; AI Agents</text>

      <rect x="606" y="193" width="240" height="14" rx="4" fill="#0B1120"/>
      <rect x="606" y="193" width="186" height="14" rx="4" fill="url(#accentBar)" fill-opacity="0.85"/>
      <text x="726" y="203.5" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#F8FAFC" letter-spacing="0.6">BUILDING &amp; SHIPPING DAILY</text>
    </g>

    <!-- Bottom Accent Line -->
    <rect x="0" y="246" width="900" height="4" fill="url(#accentBar)"/>
  </g>

  <!-- Outer Crisp Border -->
  <rect x="1" y="1" width="898" height="248" rx="16" stroke="url(#cardStroke)" stroke-width="1.5"/>
</svg>
