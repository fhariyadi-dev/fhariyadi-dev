<svg width="900" height="270" viewBox="0 0 900 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cosmicBg" x1="0" y1="0" x2="900" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050915"/>
      <stop offset="50%" stop-color="#0A142E"/>
      <stop offset="100%" stop-color="#060D20"/>
    </linearGradient>

    <radialGradient id="cyanNebula" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 96) scale(360 140)">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 220) scale(240 120)">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 220) scale(240 120)">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="180" y1="90" x2="720" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#E0F2FE"/>
      <stop offset="82%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <linearGradient id="horizonAccent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <pattern id="starDots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.9" fill="#38BDF8" opacity="0.24"/>
    </pattern>

    <clipPath id="cosmicClip">
      <rect x="1" y="1" width="898" height="268" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 0.28; transform: scale(0.84); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .spark-1 { transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
    .spark-2 { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out 0.9s infinite; }
    .spark-3 { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out 1.5s infinite; }
    .float-badge { animation: floatSlow 4.5s ease-in-out infinite; }
  </style>

  <g clip-path="url(#cosmicClip)">
    <!-- Deep Space Base -->
    <rect width="900" height="270" fill="url(#cosmicBg)"/>
    <rect width="900" height="270" fill="url(#starDots)"/>
    <rect width="900" height="270" fill="url(#cyanNebula)"/>
    <rect width="900" height="270" fill="url(#violetGlow)"/>
    <rect width="900" height="270" fill="url(#blueGlow)"/>

    <!-- Perspective Cyber-Horizon Grid at Bottom -->
    <g opacity="0.22" stroke="#38BDF8" stroke-width="0.9">
      <line x1="0" y1="216" x2="900" y2="216"/>
      <line x1="0" y1="230" x2="900" y2="230"/>
      <line x1="0" y1="248" x2="900" y2="248"/>
      <line x1="450" y1="216" x2="450" y2="270"/>
      <line x1="360" y1="216" x2="290" y2="270"/>
      <line x1="540" y1="216" x2="610" y2="270"/>
      <line x1="270" y1="216" x2="120" y2="270"/>
      <line x1="630" y1="216" x2="780" y2="270"/>
      <line x1="180" y1="216" x2="-40" y2="270"/>
      <line x1="720" y1="216" x2="940" y2="270"/>
    </g>

    <!-- Decorative Pixel Sparkles (Matching Yuna AI Aesthetic) -->
    <g class="spark-1">
      <rect x="92" y="70" width="4" height="14" rx="1" fill="#00E5FF"/>
      <rect x="87" y="75" width="14" height="4" rx="1" fill="#00E5FF"/>
    </g>
    <g class="spark-2">
      <rect x="138" y="138" width="3" height="11" rx="1" fill="#60A5FA"/>
      <rect x="134" y="142" width="11" height="3" rx="1" fill="#60A5FA"/>
    </g>
    <g class="spark-3">
      <rect x="78" y="182" width="3" height="9" rx="1" fill="#8B5CF6"/>
      <rect x="75" y="185" width="9" height="3" rx="1" fill="#8B5CF6"/>
    </g>
    <g class="spark-2">
      <rect x="798" y="68" width="4" height="14" rx="1" fill="#00E5FF"/>
      <rect x="793" y="73" width="14" height="4" rx="1" fill="#00E5FF"/>
    </g>
    <g class="spark-1">
      <rect x="752" y="146" width="3" height="11" rx="1" fill="#60A5FA"/>
      <rect x="748" y="150" width="11" height="3" rx="1" fill="#60A5FA"/>
    </g>
    <g class="spark-3">
      <rect x="822" y="178" width="3" height="9" rx="1" fill="#8B5CF6"/>
      <rect x="819" y="181" width="9" height="3" rx="1" fill="#8B5CF6"/>
    </g>

    <!-- Subtle Orbital Arcs Framing Center -->
    <circle cx="450" cy="135" r="295" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="5 9" opacity="0.5"/>
    <circle cx="450" cy="135" r="355" fill="none" stroke="#1E293B" stroke-width="0.9" opacity="0.45"/>

    <!-- Top Centered Role Pill -->
    <g class="float-badge">
      <rect x="302" y="34" width="296" height="26" rx="13" fill="#0D1B38" fill-opacity="0.9" stroke="#2563EB" stroke-opacity="0.65" stroke-width="1.2"/>
      <circle cx="322" cy="47" r="3.8" fill="#00E5FF"/>
      <text x="458" y="51" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#7DD3FC" letter-spacing="1.2">SOFTWARE &amp; WEB DEVELOPER</text>
    </g>

    <!-- Main Centered Display Name -->
    <text x="450" y="118" text-anchor="middle" class="sans" font-size="46" font-weight="800" fill="url(#nameGrad)" letter-spacing="-0.6">Fathurrahman Hariyadi</text>

    <!-- Centered Tagline -->
    <text x="450" y="152" text-anchor="middle" class="sans" font-size="15.5" font-weight="500" fill="#CBD5E1">Web Engineering  •  TypeScript &amp; React  •  AI Agent Workflows</text>

    <!-- Three Centered Handle Chips -->
    <rect x="255" y="174" width="112" height="26" rx="8" fill="#0A1630" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.1"/>
    <text x="311" y="191" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#67E8F9">@fthrxyzz</text>

    <rect x="379" y="174" width="142" height="26" rx="8" fill="#0A1630" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.1"/>
    <text x="450" y="191" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#93C5FD">fhariyadi-dev</text>

    <rect x="533" y="174" width="112" height="26" rx="8" fill="#0A1630" stroke="#8B5CF6" stroke-opacity="0.55" stroke-width="1.1"/>
    <text x="589" y="191" text-anchor="middle" class="mono" font-size="11.5" font-weight="600" fill="#C4B5FD">@askyuna.ai</text>

    <!-- Subtle Location & Email Caption -->
    <text x="450" y="236" text-anchor="middle" class="mono" font-size="11" fill="#64748B">LAMPUNG, INDONESIA  ·  HALLO@FATHURRAHMANH.ME</text>

    <!-- Bottom Glowing Horizon Bar -->
    <rect x="0" y="266" width="900" height="4" fill="url(#horizonAccent)"/>
  </g>

  <rect x="1" y="1" width="898" height="268" rx="18" stroke="#1E3A5F" stroke-width="1.4"/>
</svg>
