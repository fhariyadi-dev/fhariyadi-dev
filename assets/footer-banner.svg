    <text x="450" y="42" text-anchor="middle" class="mono" font-size="13.5" fill="#A7F3D0">&gt; echo "Thanks for visiting — let's build something impactful together."</text>
    <text x="450" y="68" text-anchor="middle" class="sans" font-size="12" fill="#64748B">Crafted by Fathur Hariyadi (@fhariyadi-dev) · Lampung, Indonesia</text>
